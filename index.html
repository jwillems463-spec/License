<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>R068 Distinction Checklist</title>
<meta name="description" content="A tickable Mark Band 3 checklist for the OCR R068 Secure Case set assignment.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap">
<style id="ck-style">
*,*::before,*::after{box-sizing:border-box}
:root{
color-scheme:light;
padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
--ground:#F1F2F5;--surface:#FFFFFF;--sunk:#E5E8EE;
--ink:#171A20;--ink-2:#4C5261;--ink-3:#828995;
--rule:#D7DAE2;--rule-soft:#E5E7ED;
--gold:#A97B25;--gold-deep:#7C590F;--gold-soft:#EFE3C6;
--good:#2F6D55;--bad:#9C3226;--focus:#2F6FB5;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
color-scheme:dark;
--ground:#131519;--surface:#1B1E25;--sunk:#23272F;
--ink:#E9EBEF;--ink-2:#A6ADBB;--ink-3:#79808E;
--rule:#2C303A;--rule-soft:#23262E;
--gold:#D9A93F;--gold-deep:#EBC469;--gold-soft:#3A2F16;
--good:#63BE9B;--bad:#DD8577;--focus:#7FB2E8;
}}
:root[data-theme="dark"]{
color-scheme:dark;
--ground:#131519;--surface:#1B1E25;--sunk:#23272F;
--ink:#E9EBEF;--ink-2:#A6ADBB;--ink-3:#79808E;
--rule:#2C303A;--rule-soft:#23262E;
--gold:#D9A93F;--gold-deep:#EBC469;--gold-soft:#3A2F16;
--good:#63BE9B;--bad:#DD8577;--focus:#7FB2E8;
}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:"Archivo","Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:820px;margin:0 auto;padding-inline:20px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ground);border-bottom:1px solid var(--rule)}
.bar-in{max-width:820px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.bar-count{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.bar-count b{color:var(--ink);font-weight:600}
.bar-line{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:transparent}
.bar-line i{display:block;height:2px;width:0;background:var(--gold);transition:width .25s ease}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:0 0 auto}
.pill[data-s="saved"] .dot{background:var(--good)}
.pill[data-s="saving"] .dot{background:var(--gold)}
.pill[data-s="error"] .dot{background:var(--bad)}

.mast{padding-block:44px 30px}
.eyebrow{font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--gold-deep);margin:0 0 16px}
h1{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:clamp(30px,6.4vw,46px);line-height:1.08;letter-spacing:-.015em;margin:0;text-wrap:balance}
.dek{font-family:"Newsreader",Georgia,serif;font-style:italic;font-size:clamp(17px,3.4vw,21px);line-height:1.45;color:var(--ink-2);margin:14px 0 0;max-width:36ch}

.facts{margin:32px 0 0;padding:0;list-style:none;display:grid;gap:14px}
.facts li{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:baseline}
.facts .k{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);min-width:78px}
.facts .v{font-size:14.5px;color:var(--ink-2);max-width:62ch}
.facts .v b{color:var(--ink);font-weight:600}

/* mark map */
.map{margin:30px 0 0;border-top:1px solid var(--rule);padding-top:20px}
.map-h{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0 0 11px}
.map-bar{display:flex;gap:3px;height:10px}
.map-bar i{display:block;background:var(--sunk);border-radius:1px}
.map-bar i.hot{background:var(--gold)}
.map-key{list-style:none;margin:11px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:4px 18px}
.map-key li{font-size:12.5px;color:var(--ink-2)}
.map-key b{color:var(--ink);font-weight:600}
.map-key li.hot b,.map-key li.hot span{color:var(--gold-deep)}
.map-note{margin:12px 0 0;font-size:13px;color:var(--ink-2);max-width:60ch}

.ladder{margin:26px 0 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding-block:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.rung .n{font-size:11px;letter-spacing:.08em;color:var(--ink-3)}
.rung .w{display:block;font-family:"Newsreader",Georgia,serif;font-size:21px;margin-top:2px}
.rung p{margin:4px 0 0;font-size:13px;color:var(--ink-2);line-height:1.45}
.rung.top .w,.rung.top .n{color:var(--gold-deep)}

.tiles{margin:26px 0 0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:12px 13px 13px}
.tile:hover{border-color:var(--ink-3)}
.tile:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tile .tt{font-size:11px;letter-spacing:.08em;color:var(--ink-3)}
.tile .tn{display:block;font-size:13.5px;font-weight:500;line-height:1.3;margin:5px 0 10px;min-height:2.6em}
.tile .tc{font-size:12px;color:var(--ink-2)}
.tile.full .tc{color:var(--good)}

.meter{height:3px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-bottom:7px}
.meter i{display:block;height:3px;width:0;background:var(--gold);transition:width .25s ease}
.full .meter i,.done .meter i{background:var(--good)}

section.ta{padding-block:38px 6px;scroll-margin-top:72px;border-top:1px solid var(--rule)}
.ta-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.tag{font-size:11.5px;letter-spacing:.1em;color:var(--gold-deep);border:1px solid var(--gold-soft);background:var(--gold-soft);padding:2px 7px;border-radius:2px}
.marks{font-size:12px;color:var(--ink-3);margin-left:auto}
h2{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:clamp(23px,4.6vw,30px);line-height:1.15;margin:0;letter-spacing:-.01em}
.ta-spec{margin:9px 0 0;font-size:13px;color:var(--ink-3);max-width:60ch}
.ta-meter{margin:18px 0 0;display:flex;align-items:center;gap:12px}
.ta-meter .meter{flex:1;margin:0}
.ta-meter .c{font-size:12px;color:var(--ink-2);white-space:nowrap}
.ta-meter.done .c{color:var(--good)}
.band{margin:20px 0 4px;font-size:14.5px;line-height:1.55;max-width:62ch}
.band .bl{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-deep);margin-right:9px}
.band .bt{font-family:"Newsreader",Georgia,serif;font-style:italic;font-size:17px;color:var(--ink-2)}

.ex{margin:18px 0 0;border:1px solid var(--rule);border-radius:3px;background:var(--surface);padding:0 14px}
.ex>summary{cursor:pointer;list-style:none;padding:11px 0;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-deep);display:flex;align-items:center;gap:9px}
.ex>summary::-webkit-details-marker{display:none}
.ex>summary::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--gold-deep);border-bottom:1.5px solid var(--gold-deep);transform:rotate(-45deg);flex:0 0 auto}
.ex[open]>summary::before{transform:rotate(45deg)}
.ex>summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ex ul{list-style:none;margin:0;padding:0}
.ex li{padding:12px 0;border-top:1px solid var(--rule-soft)}
.ex-lab{display:block;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.ex-x{font-family:"Newsreader",Georgia,serif;font-size:16px;line-height:1.5;color:var(--ink);max-width:58ch;display:block}
.ex-note{margin:0;padding:11px 0 13px;border-top:1px solid var(--rule-soft);font-size:12px;color:var(--ink-3);line-height:1.5}

ul.items{list-style:none;margin:14px 0 0;padding:0}
li.item{display:flex;gap:13px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--rule-soft)}
li.item:first-child{border-top:0}
.box{appearance:none;-webkit-appearance:none;width:19px;height:19px;margin:2px 0 0;flex:0 0 auto;border:1.5px solid var(--rule);border-radius:3px;background:var(--surface);cursor:pointer;display:grid;place-content:center}
.box::after{content:"";width:9px;height:5px;border-left:2px solid var(--surface);border-bottom:2px solid var(--surface);transform:rotate(-45deg) scale(.5);opacity:0}
.box:hover{border-color:var(--ink-3)}
.box:checked{background:var(--gold);border-color:var(--gold)}
.box:checked::after{opacity:1;transform:rotate(-45deg) scale(1)}
.box:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.item-body{cursor:pointer;display:block}
.item-t{display:block;font-weight:600;font-size:15px;line-height:1.4;text-wrap:pretty}
.item-w{display:block;margin-top:3px;font-size:13.5px;line-height:1.5;color:var(--ink-2);max-width:60ch}
li.item.done .item-t{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--rule);text-decoration-thickness:1px}
li.item.done .item-w{color:var(--ink-3)}

.words{padding-block:40px 8px;border-top:1px solid var(--rule);scroll-margin-top:72px}
.words .lead{margin:9px 0 0;font-size:13px;color:var(--ink-3);max-width:62ch}
.words dl{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:11px 18px}
.words dt{font-family:"Newsreader",Georgia,serif;font-size:17px;color:var(--gold-deep);white-space:nowrap}
.words dd{margin:0;font-size:14px;color:var(--ink-2);line-height:1.5;max-width:56ch}

.pit{padding-block:40px 8px;border-top:1px solid var(--rule);scroll-margin-top:72px}
.pit .lead{margin:9px 0 0;font-size:13px;color:var(--ink-3);max-width:58ch}
.pit ol{list-style:none;counter-reset:p;margin:20px 0 0;padding:0}
.pit li{counter-increment:p;display:grid;grid-template-columns:auto 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--rule-soft);align-items:baseline}
.pit li::before{content:counter(p,decimal-leading-zero);font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:var(--bad)}
.pit li span{font-size:14.5px;line-height:1.5;max-width:60ch}

footer{padding-block:38px 72px;border-top:1px solid var(--rule);margin-top:40px}
footer p{margin:0 0 12px;font-size:13px;color:var(--ink-3);max-width:62ch;line-height:1.55}
.reset{margin-top:8px;font:inherit;font-size:12.5px;color:var(--ink-2);background:transparent;border:1px solid var(--rule);border-radius:3px;padding:6px 11px;cursor:pointer}
.reset:hover{border-color:var(--ink-3)}
.reset[data-armed="1"]{color:var(--bad);border-color:var(--bad)}
.reset:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

@media (max-width:720px){
.tiles{grid-template-columns:repeat(2,1fr)}
.ladder{grid-template-columns:1fr;gap:14px}
.facts li{grid-template-columns:1fr;gap:2px}
.facts .k{min-width:0}
.words dl{grid-template-columns:1fr;gap:3px 0}
.words dd{margin-bottom:9px}
.marks{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

{t:"Collate the results and present them with effective methods",w:"The right chart for each data type, with totals and sample size visible."},
{t:"Review the collated results against your original aims",w:"The brief tells you to consider your initial aims. A comprehensive review answers: did I find out what I set out to find out, and what does that mean for the design?"},

]},

var WORDS=[
["Comprehensive","Complete — includes everything required to show depth and breadth of understanding."],
["Detailed","Gives point-by-point consideration of all the key information."],
["Fully","Comprehensive in range and scope; the result is fully fit for purpose."],
["Justify","The reasons for doing something are explained in full."],
["Accurate","Correct in all details; performed with care and precision."],
["Clear","Focused and accurately expressed, without ambiguity."],
["All","Fully comprehensive and wide-ranging — almost all or all of what a full response expects."],
["Effective","Successful in producing the intended result, in relation to the brief."]
];

var PITS=[
"Describing instead of justifying — the single most common reason good work sits in Mark Band 2.",
"Research that never visibly changes a decision in Tasks 2, 3 or 5.",
"A customer profile so broad it excludes nobody, leaving the design mix nothing to answer to.",
"Arithmetic slips in Task 5, where nearly a third of the unit’s marks live.",
"Forgetting the £12,000 fixed cost in the total-cost and break-even calculations.",
"Only one kind of feedback in Task 4, when the grid names both verbal and written.",
"Risks in Task 6 listed but never evaluated, and no realistic way to overcome them.",
"Text lifted from websites without referencing — that is malpractice, not a lost mark."
];

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function ids(s,i){return s.id+"-"+(i+1);}

var state={v:2,checked:{},updatedAt:0};
try{var p=JSON.parse(document.getElementById("ck-state").textContent);if(p&&typeof p==="object"){state.checked=p.checked||{};state.updatedAt=p.updatedAt||0;}}catch(e){}

var total=0;DATA.forEach(function(s){total+=s.items.length;});
var TASKS=DATA.slice(0,6);

function bar(){
return '<div class="bar"><div class="bar-in">'
+'<span class="bar-count mono" id="barcount"><b>0</b> of '+total+' done</span>'
+'<span class="pill" id="pill" hidden><i class="dot"></i><span class="t"></span></span>'
+'</div><span class="bar-line"><i id="barfill"></i></span></div>';
}

function map(){
return '<div class="map"><p class="map-h mono">Where the 60 marks are</p>'
+'<div class="map-bar">'+TASKS.map(function(s){
return '<i class="'+(s.marks===18?"hot":"")+'" style="width:'+(s.marks/60*100)+'%"></i>';
}).join("")+'</div>'
+'<ul class="map-key">'+TASKS.map(function(s,i){
return '<li class="'+(s.marks===18?"hot":"")+'"><span class="mono">T'+(i+1)+'</span> '+esc(s.title)+' <b class="mono">'+s.marks+'</b></li>';
}).join("")+'</ul>'
+'<p class="map-note">Task 5 carries 18 marks on its own — nearly a third of the unit — and most of them are accuracy marks on calculations you can check. It is the cheapest place to gain marks and the easiest to throw them away.</p></div>';
}

function mast(){
return '<div class="wrap mast">'
+'<p class="eyebrow mono">Cambridge National in Enterprise &amp; Marketing · Set assignment: Secure Case</p>'
+'<h1>R068: Design a business proposal</h1>'
+'<p class="dek">What Mark Band 3 work has in it, task by task, for the Secure Case laptop-case brief.</p>'
+'<ul class="facts">'
+'<li><span class="k mono">The grade</span><span class="v">D⁎ is a <b>qualification</b> grade, worked out from R067, R068 and R069 together — not something this unit awards on its own. The target here is <b>Mark Band 3 on every strand</b> of all six tasks, out of 60.</span></li>'
+'<li><span class="k mono">The thread</span><span class="v">Research → profile → design → feedback → finances → risks. Each task is meant to feed the next, and the grids keep asking you to <b>refer back</b>. Work that carries the thread forward reads as Band 3 almost by itself.</span></li>'
+'</ul>'
+map()
+'<div class="ladder">'
+'<div class="rung"><span class="n mono">BAND 1</span><span class="w">Identifies</span><p>Basic, brief, limited. Lists things without developing them.</p></div>'
+'<div class="rung"><span class="n mono">BAND 2</span><span class="w">Describes</span><p>Sound, adequate, some. Right content, not fully developed.</p></div>'
+'<div class="rung top"><span class="n mono">BAND 3</span><span class="w">Justifies</span><p>Comprehensive, detailed, accurate, fully. Reasons explained in full.</p></div>'
+'</div>'
+'<div class="tiles">'+TASKS.map(function(s){
return '<a class="tile" href="#'+s.id+'" data-tile="'+s.id+'"><span class="tt mono">'+esc(s.tag)+' · '+s.marks+'</span><span class="tn">'+esc(s.title)+'</span><span class="meter"><i></i></span><span class="tc mono">0/'+s.items.length+'</span></a>';
}).join("")+'</div>'
+'</div>';
}

function section(s){
return '<section class="ta wrap" id="'+s.id+'" data-sec="'+s.id+'">'
+'<div class="ta-top"><span class="tag mono">'+esc(s.tag)+'</span><h2>'+esc(s.title)+'</h2>'
+(s.marks?'<span class="marks mono">'+s.marks+' marks</span>':'')+'</div>'
+'<p class="ta-spec">'+esc(s.spec)+'</p>'
+'<div class="ta-meter"><span class="meter"><i></i></span><span class="c mono">0/'+s.items.length+'</span></div>'
+'<p class="band"><span class="bl">Band 3 reads as</span><span class="bt">'+esc(s.band)+'</span></p>'
+(s.ex?'<details class="ex" open><summary>Example bullets for this task</summary><ul>'
+s.ex.map(function(e){return '<li><span class="ex-lab">'+esc(e.l)+'</span><span class="ex-x">'+esc(e.x)+'</span></li>';}).join("")
+'</ul><p class="ex-note">Illustrative only. The percentages and figures are invented to show the shape of a Band 3 answer \u2014 copying them into your own work would be malpractice. Write sentences in this form around your own findings.</p></details>':'')
+'<ul class="items">'+s.items.map(function(it,i){var id=ids(s,i);
return '<li class="item" data-item="'+id+'"><input type="checkbox" class="box" id="i-'+id+'" data-id="'+id+'" aria-labelledby="t-'+id+'">'
+'<label class="item-body" for="i-'+id+'"><span class="item-t" id="t-'+id+'">'+esc(it.t)+'</span><span class="item-w">'+esc(it.w)+'</span></label></li>';
}).join("")+'</ul></section>';
}

function words(){
return '<section class="words wrap" id="words"><div class="ta-top"><span class="tag mono">WORDS</span><h2>The words the grid marks you against</h2></div>'
+'<p class="lead">The brief ends with the exam board’s own definitions of the descriptor words used in the marking grids. These are the Mark Band 3 ones. Write to them literally.</p>'
+'<dl>'+WORDS.map(function(w){return '<dt>'+esc(w[0])+'</dt><dd>'+esc(w[1])+'</dd>';}).join("")+'</dl></section>';
}

function pitfalls(){
return '<section class="pit wrap" id="pitfalls"><div class="ta-top"><span class="tag mono">RISK</span><h2>Where the marks get lost</h2></div>'
+'<p class="lead">Roughly in order of how often each one holds otherwise-good work below Mark Band 3.</p>'
+'<ol>'+PITS.map(function(p){return '<li><span>'+esc(p)+'</span></li>';}).join("")+'</ol></section>';
}

function foot(){
return '<footer class="wrap"><p>Ticking every box is not a grade. It is a way of making sure nothing that carries marks is missing before you submit — the quality of the justification still decides the band.</p>'
+'<p>An unofficial personal study aid, built from the Secure Case set assignment. The brief itself is the authority on what each task requires; where the two disagree, the brief wins. The work you submit has to be your own.</p>'
+'<button class="reset" id="reset" type="button">Reset all ticks</button></footer>';
}

function render(){
var app=document.getElementById("app");
app.innerHTML=bar()+mast()+DATA.map(section).join("")+words()+pitfalls()+foot();
app.addEventListener("change",function(ev){
var el=ev.target;if(!el||!el.classList||!el.classList.contains("box"))return;
var id=el.getAttribute("data-id");
if(el.checked){state.checked[id]=1;}else{delete state.checked[id];}
refresh();scheduleSave();
});
var rb=document.getElementById("reset");
rb.addEventListener("click",function(){
if(rb.getAttribute("data-armed")==="1"){
rb.removeAttribute("data-armed");rb.textContent="Reset all ticks";
state.checked={};refresh();scheduleSave();
}else{
rb.setAttribute("data-armed","1");rb.textContent="Tap again to clear everything";
setTimeout(function(){if(rb.getAttribute("data-armed")==="1"){rb.removeAttribute("data-armed");rb.textContent="Reset all ticks";}},4000);
}
});
refresh();
}

function refresh(){
var done=0;
DATA.forEach(function(s){
var n=0;
s.items.forEach(function(it,i){
var id=ids(s,i);var on=!!state.checked[id];if(on){n++;}
var box=document.getElementById("i-"+id);if(box){box.checked=on;}
var li=document.querySelector('[data-item="'+id+'"]');if(li){li.classList.toggle("done",on);}
});
done+=n;
var pc=s.items.length?Math.round(n/s.items.length*100):0;
var sec=document.querySelector('[data-sec="'+s.id+'"]');
if(sec){
var m=sec.querySelector(".ta-meter");
m.querySelector(".meter i").style.width=pc+"%";
m.querySelector(".c").textContent=n+"/"+s.items.length;
m.classList.toggle("done",n===s.items.length);
}
var tile=document.querySelector('[data-tile="'+s.id+'"]');
if(tile){
tile.querySelector(".meter i").style.width=pc+"%";
tile.querySelector(".tc").textContent=n+"/"+s.items.length;
tile.classList.toggle("full",n===s.items.length);
}
});
var bc=document.getElementById("barcount");
if(bc){bc.innerHTML="<b>"+done+"</b> of "+total+" done";}
var bl=document.getElementById("barfill");
if(bl){bl.style.width=(total?Math.round(done/total*100):0)+"%";}
}

var artifact=null,resolved=false,timer=null,tries=0;

function setPill(s,txt){
var p=document.getElementById("pill");if(!p)return;
p.setAttribute("data-s",s);p.hidden=false;
p.querySelector("span.t").textContent=txt;
}
function saveLocal(){
try{localStorage.setItem(LS,JSON.stringify({checked:state.checked,updatedAt:Date.now()}));}catch(e){}
}
function loadLocal(){
try{
var r=localStorage.getItem(LS);if(!r)return;
var p=JSON.parse(r);
if(p&&p.checked&&(p.updatedAt||0)>(state.updatedAt||0)){state.checked=p.checked;refresh();}
}catch(e){}
}
function buildDoc(next){
var css=document.getElementById("ck-style").textContent;
var code=document.getElementById("ck-code").textContent;
var json=JSON.stringify(next).replace(/</g,"\\u003c");
return '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n'
+'<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'
+'<title>'+TITLE+'<\/title>\n'
+'<link rel="stylesheet" href="'+FONTS+'">\n'
+'<style id="ck-style">'+css+'<\/style>\n</head>\n<body>\n'
+'<div id="app"><\/div>\n'
+'<script id="ck-state" type="application/json">'+json+'<\/script>\n'
+'<script id="ck-code">'+code+'<\/script>\n</body>\n<\/html>';
}
function scheduleSave(){
saveLocal();
if(timer){clearTimeout(timer);}
if(resolved&&!artifact){setPill("local","Ticks saved in this browser");return;}
setPill("saving","Saving…");
timer=setTimeout(flush,900);
}
function flush(){
timer=null;
if(!resolved){
tries++;
if(tries>40){setPill("local","Ticks saved in this browser");return;}
timer=setTimeout(flush,400);return;
}
if(!artifact){setPill("local","Ticks saved in this browser");return;}
var next={v:2,checked:state.checked,updatedAt:Date.now()};
artifact.publish(buildDoc(next)).then(function(){
setPill("saved","Saved to this page");
})["catch"](function(err){
var code=err&&err.code;
if(code==="conflict"){setPill("saving","Updated elsewhere — reloading");}
else if(code==="not_granted"||code==="not_writer"){artifact=null;setPill("local","View only — ticks stay on this device");}
else{setPill("error","Not saved — try ticking again");}
});
}
function boot(){
render();
var c=window.claude;
var pr=(c&&typeof c.use==="function")?c.use("artifact"):Promise.resolve(null);
Promise.resolve(pr)["catch"](function(){return null;}).then(function(a){
artifact=a||null;resolved=true;
if(artifact){setPill("saved","Ticks save to this page");}
else{loadLocal();setPill("local","Ticks saved in this browser");}
});
}
boot();
</script>
</body>
</html>
